<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="stylespurch.css">
        <script src="script.js"></script>
    </head>
    <body>
        <div class="BuyOpts">
        <h3>Please enter your debit card information:</h3>
            <form method="post">
                <label>
                    <h3>Card number:</h3>
                    <input name="cardNumber"></input>
                </label>
                <label>
                    <h3>Expiry date:</h3>
                    <input type="date"></input>
                </label>
                <label>
                    <h3>Name on the Card:</h3>
                    <input name="cardName"></input>
                </label>
                <label>
                    <h3>Card security code:</h3>
                    <input name="cardSecCode"></input>
                </label>
                <label>
                    <input type="button" value="save"></input>
                </label>
            </form>
        </div>
    </body>
